name: CI

on:
  pull_request:
    # `ready_for_review` is not a default type — without it, marking a draft PR
    # ready (with no new push) would never trigger CI, leaving required checks
    # stuck pending.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  # Validate the merged state, and warm the npm cache on the ref that feature
  # PRs actually restore from. Actions cache lookups fall back from the current
  # ref to the PR's base branch, so without a run at `ref=dev` no dev-scoped
  # cache ever exists and every feature PR starts cold. Two branches each green
  # on a stale base can also break once merged, and only `dev` sees that tree.
  push:
    # `main`: full validation as the post-merge safety net (rules/ci.md), and
    # what gates the Graphify snapshot job below (opted-in repos only).
    branches: [dev, main]
  # Tier 2 (merge-queue lane): uncomment once this repo has a suite too slow
  # for the PR gate (e2e, a11y), and update ci-success per the comment on
  # that job below. Requires enabling the merge queue on the branch ruleset;
  # CI Success remains the only required check — no second name to add.
  # See rules/ci.md's "Two-tier check model" and the commented example job
  # at the bottom of this file.
  # merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Idempotent validation: a newer head makes the previous run irrelevant.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every cheap gate lives in ONE job, because Actions bills each job rounded UP
  # to the whole minute. Formatting, markdown lint and workflow lint are seconds
  # apiece and share a checkout, so splitting them would buy three billed minutes
  # for one minute of work and no parallelism worth having.
  check:
    name: Check (format, markdown, workflows)
    runs-on: ubuntu-latest
    # Sub-minute in every healthy run. Capped so a hung step cannot inherit the
    # 360-minute default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Markdown
        run: npm run lint:md

      # Pinned by digest-bearing tag rather than a floating major: a workflow
      # linter that silently changes its ruleset turns a green history red for
      # reasons unrelated to the diff.
      - name: Workflows
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  # Folded in from a standalone pr-title-lint.yml: a separately-required
  # ruleset check has the same merge-queue re-validation problem CI Success
  # solves (rules/ci.md's "Two-tier check model"), and `needs:` can't reach
  # across workflow files — so PR-title linting lives here and joins
  # ci-success's needs: instead of being its own required check.
  lint-pr-title:
    name: Lint PR Title
    # A PR's title cannot change once it's in the merge queue, so there is
    # nothing to re-check on merge_group — expected to skip there, same as
    # `check`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A regex over the PR title — seconds. Capped so a hung action cannot
    # inherit the 360-minute default (#3397).
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            test
            build
            ci
            style
            revert
          requireScope: false

  # One aggregate required check, so adding or splitting jobs never means editing
  # the branch ruleset. It also closes the skipped-job hole: a skipped job
  # satisfies a required status check of the same name, so requiring `check`
  # directly would let a path-filtered skip merge unverified.
  #
  # This repo has no Tier 2 (merge_group) job yet, so this stays a
  # pull_request-only job with an unconditional skip-check. Once a slow suite
  # (e2e, a11y) gets added as a merge_group-gated job below, this job needs
  # three changes — see rules/ci.md's "Two-tier check model" for the full
  # convention, and the commented example at the bottom of this file:
  #   1. `if:` becomes `always() && (github.event_name == 'pull_request' ||
  #      github.event_name == 'merge_group')`.
  #   2. `needs:` gains the new Tier 2 job(s).
  #   3. The skip-check becomes event-aware: Tier 1 jobs (check,
  #      lint-pr-title) are expected to skip on merge_group; Tier 2 jobs are
  #      expected to skip on pull_request. Only an *unexpected* skip fails.
  ci-success:
    # Named to match the other repos exactly, so one branch ruleset definition is
    # portable across all of them without editing the required-check string.
    name: CI Success
    if: always() && github.event_name == 'pull_request'
    needs: [check, lint-pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no required job failed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -q '"result": *"failure"' && {
            echo "::error::A required job failed."; exit 1; }
          echo "$RESULTS" | grep -q '"result": *"cancelled"' && {
            echo "::error::A required job was cancelled."; exit 1; }
          echo "$RESULTS" | grep -q '"result": *"skipped"' && {
            echo "::error::A required job was skipped — it had work to do."; exit 1; }
          echo "All required jobs succeeded."

    # --- Tier 2 (merge-queue lane) example — commented out, not active. ---
    # Uncomment and adapt once this repo has a slow suite (e2e, a11y) to gate.
    # Also uncomment `merge_group:` in the `on:` block above. There is still
    # only one required check (`CI Success`) — do not add a second aggregate.
    # This shows the resulting `ci-success` job with all three changes from
    # the comment on the real `ci-success` job above applied, plus the new
    # `e2e` job. Replace the real `ci-success` job above with this version
    # (and delete this commented block) rather than keeping both.
    #
    # e2e:
    #   name: E2E
    #   if: github.event_name == 'merge_group'
    #   runs-on: ubuntu-latest
    #   timeout-minutes: 20
    #   steps:
    #     - uses: actions/checkout@v4
    #     - uses: actions/setup-node@v4
    #       with:
    #         node-version: 20
    #         cache: npm
    #     - run: npm ci
    #     - run: npm run test:e2e
    #
    # ci-success:
    #   name: CI Success
    #   if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    #   needs: [check, lint-pr-title, e2e]
    #   runs-on: ubuntu-latest
    #   timeout-minutes: 5
    #   steps:
    #     - name: Verify no required job failed or was unexpectedly skipped
    #       env:
    #         RESULTS: ${{ toJSON(needs) }}
    #         EVENT: ${{ github.event_name }}
    #       run: |
    #         echo "$RESULTS"
    #         echo "$RESULTS" | grep -q '"result": *"failure"' && {
    #           echo "::error::A required job failed."; exit 1; }
    #         echo "$RESULTS" | grep -q '"result": *"cancelled"' && {
    #           echo "::error::A required job was cancelled."; exit 1; }
    #         # Tier 1 (check, lint-pr-title) is expected to skip on merge_group;
    #         # Tier 2 (e2e) is expected to skip on pull_request. Only an
    #         # unexpected skip on the tier's own trigger fails the check.
    #         python3 - "$EVENT" <<'PYEOF'
    #         import json, os, sys
    #         event = sys.argv[1]
    #         results = json.loads(os.environ["RESULTS"])
    #         tier1, tier2 = ("check", "lint-pr-title"), ("e2e",)
    #         watch = tier1 if event == "pull_request" else tier2
    #         for job in watch:
    #             if results[job]["result"] == "skipped":
    #                 print(f"::error::{job} was skipped on {event} — it had work to do.")
    #                 sys.exit(1)
    #         PYEOF
    #         echo "All required jobs succeeded."

  # CI-side freshness redundancy for the post-merge/post-checkout husky hooks
  # (.husky/): those only fire on a machine that has the graphify CLI
  # installed and pulls locally, so this is what guarantees the published
  # call-flow view is never more than one push stale — same double-coverage
  # reasoning as dotrepo-sync.sh (hook) + link-doctor.sh (verify) in
  # dotclaude. graphify-out/ itself is gitignored (rules/context-tools.md),
  # so a fresh checkout never has it; the opt-in signal is the committed
  # `.claude/skills/graphify/` directory that `graphify install --project`
  # writes. Not part of `ci-success` — this never gates a PR, only publishes
  # a snapshot after merge, and is a true no-op (steps skipped, not failed)
  # on a repo that hasn't opted in.
  graphify:
    name: Graphify call-flow snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Graphify opt-in
        id: graphify-check
        run: |
          if [ -d .claude/skills/graphify ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.graphify-check.outputs.enabled == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update graph and export call-flow HTML
        if: steps.graphify-check.outputs.enabled == 'true'
        run: |
          uv tool install graphifyy
          graphify update .
          graphify export callflow-html

      - name: Upload call-flow HTML artifact
        if: steps.graphify-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: graphify-callflow-html
          path: graphify-out/*-callflow.html
          retention-days: 30
