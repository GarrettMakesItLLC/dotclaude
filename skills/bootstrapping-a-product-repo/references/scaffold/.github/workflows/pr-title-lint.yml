name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev]

permissions:
  pull-requests: read
  statuses: write

# `synchronize` has to stay in the trigger list — this posts a commit status and
# "Semantic PR Title" is required on the default branch, so a new head SHA needs
# a fresh one even though the title cannot have changed. What it does not need is
# one run per push in a burst: each is a whole billed minute for a two-second
# check, and only the newest SHA's status counts.
concurrency:
  group: pr-title-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: Semantic PR Title
    runs-on: ubuntu-latest
    # A regex over the PR title — seconds. Capped so a hung action cannot inherit
    # the 360-minute default (#3397).
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
            test
            build
            ci
            style
            revert
          requireScope: false
