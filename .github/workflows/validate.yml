name: validate

# A malformed settings.json/keybindings.json or a broken bootstrap.sh would
# silently break the next Claude Code session on every machine that pulls.
# This catches it before it lands.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence only pays for
# the last one. This workflow is read-only/idempotent, so cancel is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Skip draft PRs — CI minutes are metered, and a draft hasn't been
    # self-reviewed yet. Runs once the PR is marked ready_for_review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in settings.json keybindings.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('$f: valid JSON')"
          done
          # Any other *.json that may appear (e.g. mcp-servers.example.json).
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open('$f'))" \
              || { echo "INVALID JSON: $f"; exit 1; }
          done

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          for f in $(git ls-files '*.sh'); do
            echo "→ $f"
            bash -n "$f"
            shellcheck -S warning "$f"
          done

      - name: Run hook self-tests
        run: |
          bash hooks/git-guard.test.sh
          bash hooks/worktree-guard.test.sh
          bash hooks/worktree-bootstrap.test.sh
          bash hooks/verify-reminder.test.sh

  commitlint:
    # Lightweight conventional-commit check (no husky/node toolchain). Validates
    # PR commit subjects against the prefixes CLAUDE.md requires.
    # Skip draft PRs — see validate job for why.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|perf|style|ci|build|revert)(\([a-z0-9 ./-]+\))?!?: .+'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "✗ non-conventional: $subject"
              fail=1
            else
              echo "✓ $subject"
            fi
          done < <(git rev-list --no-merges "$base..$head")
          exit $fail

  mcp-github:
    # Build, typecheck, and test the vendored github-rest MCP — the server we
    # prefer over `gh` for PR/issue ops. A broken build here would slip past the
    # other jobs and break bootstrap.sh on the next machine that pulls.
    # Only runs when mcp/github changed (change-detection keeps other PRs cheap).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mcp:
              - 'mcp/github/**'
      - if: steps.changes.outputs.mcp == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/github/package-lock.json
      - if: steps.changes.outputs.mcp == 'true'
        working-directory: mcp/github
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
