name: validate

# A malformed settings.json/keybindings.json or a broken bootstrap.sh would
# silently break the next Claude Code session on every machine that pulls.
# This catches it before it lands.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in settings.json keybindings.json; do
            python3 -c "import json,sys; json.load(open('$f')); print('$f: valid JSON')"
          done
          # Any other *.json that may appear (e.g. mcp-servers.example.json).
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open('$f'))" \
              || { echo "INVALID JSON: $f"; exit 1; }
          done

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          for f in $(git ls-files '*.sh'); do
            echo "→ $f"
            bash -n "$f"
            shellcheck -S warning "$f"
          done

      - name: Run hook self-tests
        run: |
          bash hooks/git-guard.test.sh
          bash hooks/worktree-guard.test.sh
          bash hooks/verify-reminder.test.sh

  commitlint:
    # Lightweight conventional-commit check (no husky/node toolchain). Validates
    # PR commit subjects against the prefixes CLAUDE.md requires.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|perf|style|ci|build|revert)(\([a-z0-9 ./-]+\))?!?: .+'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "✗ non-conventional: $subject"
              fail=1
            else
              echo "✓ $subject"
            fi
          done < <(git rev-list --no-merges "$base..$head")
          exit $fail
