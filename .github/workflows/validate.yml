name: validate

# A malformed settings.json/keybindings.json or a broken bootstrap.sh would
# silently break the next Claude Code session on every machine that pulls.
# This catches it before it lands.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter queries the PR Files API on pull_request events

# Cancel superseded runs on the same ref so a rapid push sequence only pays for
# the last one. This workflow is read-only/idempotent, so cancel is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Skip draft PRs — CI minutes are metered, and a draft hasn't been
    # self-reviewed yet. Runs once the PR is marked ready_for_review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open('$f'))" \
              || { echo "INVALID JSON: $f"; exit 1; }
            echo "✓ $f"
          done

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          for f in $(git ls-files '*.sh'); do
            echo "→ $f"
            bash -n "$f"
            shellcheck -S warning "$f"
          done

      - name: Run hook self-tests
        # Globbed, not enumerated, so a new hook's tests can never be forgotten.
        run: |
          shopt -s nullglob
          tests=(hooks/*.test.sh)
          [ ${#tests[@]} -gt 0 ] || { echo "no hook self-tests found"; exit 1; }
          for f in "${tests[@]}"; do
            echo "→ $f"
            bash "$f"
          done

  config-drift:
    # The repo's own rule: never hand-maintain a second copy of a machine-checkable
    # fact. These are the couplings that have silently rotted before.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every hook wired in settings.json exists and is executable
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          fail = []
          cfg = json.load(open("settings.json"))
          for event, groups in cfg.get("hooks", {}).items():
              for group in groups:
                  for hook in group.get("hooks", []):
                      cmd = hook.get("command", "")
                      m = re.search(r'/\.claude/hooks/([A-Za-z0-9._-]+\.sh)', cmd)
                      if not m:
                          continue
                      path = os.path.join("hooks", m.group(1))
                      if not os.path.exists(path):
                          fail.append(f"{event}: settings.json references missing {path}")
                      elif not os.access(path, os.X_OK):
                          fail.append(f"{event}: {path} is not executable")
          print("\n".join(fail) if fail else "✓ hook wiring resolves")
          sys.exit(1 if fail else 0)
          PY

      - name: Every hook has a self-test
        run: |
          fail=0
          for f in hooks/*.sh; do
            case "$f" in *.test.sh) continue ;; esac
            t="${f%.sh}.test.sh"
            [ -f "$t" ] || { echo "✗ $f has no $t"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "✓ every hook has a self-test"
          exit $fail

      - name: bootstrap.sh links exactly the skills that exist
        run: |
          python3 - <<'PY'
          import os, re, sys
          src = open("bootstrap.sh").read()
          # Anchor on the closing paren at line start: the per-entry trailing
          # comments contain their own parens, so a [^)]* capture truncates.
          m = re.search(r'SHARED_SKILLS=\((.*?)\n\)', src, re.S)
          if not m:
              print("could not find SHARED_SKILLS in bootstrap.sh"); sys.exit(1)
          # Quoted entries only — the array's trailing `# comment` on each line
          # would otherwise be scraped in as skill names.
          listed = set(re.findall(r'"([\w-]+)"', m.group(1)))
          on_disk = {d for d in os.listdir("skills") if os.path.isdir(os.path.join("skills", d))}
          missing, extra = on_disk - listed, listed - on_disk
          for s in sorted(missing): print(f"✗ skills/{s} exists but bootstrap.sh does not link it")
          for s in sorted(extra):   print(f"✗ bootstrap.sh links skills/{s} which does not exist")
          if not (missing or extra): print("✓ SHARED_SKILLS matches skills/")
          sys.exit(1 if (missing or extra) else 0)
          PY

  commitlint:
    # This job is the enforcement boundary for conventional commits — which is why
    # CLAUDE.md does not restate the prefix list.
    # Skip draft PRs — see validate job for why.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|perf|style|ci|build|revert)(\([a-z0-9 ./-]+\))?!?: .+'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "✗ non-conventional: $subject"
              fail=1
            else
              echo "✓ $subject"
            fi
          done < <(git rev-list --no-merges "$base..$head")
          exit $fail

  mcp-github:
    # Build, typecheck, and test the vendored github-rest MCP — the server we
    # prefer over `gh` for PR/issue ops. A broken build here would slip past the
    # other jobs and break bootstrap.sh on the next machine that pulls.
    # Only runs when mcp/github changed (change-detection keeps other PRs cheap).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mcp:
              - 'mcp/github/**'
      - if: steps.changes.outputs.mcp == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/github/package-lock.json
      - if: steps.changes.outputs.mcp == 'true'
        working-directory: mcp/github
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  ci-success:
    # The single required check. A *skipped* job satisfies a required status check
    # of the same name, so gating on the individual jobs would let a PR merge
    # unverified. This job needs them all and fails on any non-success result,
    # and adding or splitting a job never means editing the branch ruleset.
    if: always() && github.event_name == 'pull_request'
    needs: [validate, config-drift, commitlint, mcp-github]
    runs-on: ubuntu-latest
    steps:
      - name: Assert every upstream job succeeded
        run: |
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {j: m["result"] for j, m in needs.items() if m["result"] != "success"}
          for j, r in sorted(bad.items()):
              print(f"✗ {j}: {r}")
          print("✓ all jobs succeeded" if not bad else "")
          sys.exit(1 if bad else 0)
          PY
        env:
          RESULTS: ${{ toJSON(needs) }}
