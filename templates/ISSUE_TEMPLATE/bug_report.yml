# Generic maintainer bug template. Copy into a repo's .github/ISSUE_TEMPLATE/
# and customize. App end-user feedback should route through source:* triage
# (see the managing-work-with-issues skill), not this form.
name: 🐞 Bug report
description: Something in the app or codebase is broken.
labels: ['type:bug', 'status:backlog']
body:
  - type: textarea
    id: description
    attributes:
      label: What's broken?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - low — minor / cosmetic
        - medium — annoying but usable
        - high — blocks a feature
        - critical — app unusable
      default: 1
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where (file:line, route, or page)
      placeholder: src/app/foo/page.tsx:42
  - type: textarea
    id: context
    attributes:
      label: Environment / additional context
      placeholder: Browser, OS, screenshots, console errors, etc.
